spring:
  application:
    name: User_Service

  config:
    import: optional:file:../.env-docker[.properties]

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        debug: false
        transport:
          protocol: smtp
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    indexes:
      subscribition: ${KAFKA_USER_SUBSCRIBE}
      user-topic: ${KAFKA_USER_TOPIC}
      twitt-to-users: ${KAFKA_TWITT_TO_USERS}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  cassandra:
    contact-points: ${CASSANDRA_CONTACT_POINT}
    port: ${CASSANDRA_PORT}
    keyspace-name: ${CASSANDRA_KEY_SPACE}
    local-datacenter: ${CASSANDRA_LOCAL_DATACENTER}
    schema-action: create_if_not_exists

server:
  port: 8001
